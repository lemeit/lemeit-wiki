site_name: Documentación de Proyectos Lemeit
site_description: Documentación técnica y bitácora de los proyectos de lemeit.ar — Red Ambiental Saladillo, Eureka AI y los que se sumen
site_author: Ing. Luciano Lamaita
site_url: https://wiki.lemeit.ar/

repo_name: lemeit/lemeit-wiki
repo_url: https://github.com/lemeit/lemeit-wiki
edit_uri: ''

docs_dir: docs  # los .md editables viven directamente acá

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Modo oscuro
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Modo claro
  font:
    text: -apple-system
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

nav:
  - Inicio: index.md
  - Red Ambiental:
      - Resumen: red-ambiental/index.md
      - Aire Saladillo (aq.lemeit.ar): red-ambiental/01-aire-saladillo.md
      - EMA Saladillo (emas.lemeit.ar): red-ambiental/02-ema-saladillo.md
      - Calidad del Agua (wq.lemeit.ar): red-ambiental/03-agua-saladillo.md
      - Bitácora: red-ambiental/99-bitacora.md
  - Eureka AI:
      - Resumen: eureka-tutor/index.md
  - Profe Lamaita:
      - Resumen: profe-lemeit/index.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: '¶'
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lemeit
      name: Organización lemeit en GitHub
  generator: false
