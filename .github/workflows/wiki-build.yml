name: Build wiki (MkDocs Material)
on:
  push:
    branches: [main]
    paths:
      - 'wiki-src/**'
      - '.github/workflows/wiki-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: wiki-src/requirements.txt
      - name: Install MkDocs + Material
        run: pip install -r wiki-src/requirements.txt
      - name: Build MkDocs site → site/
        run: |
          cd wiki-src
          mkdocs build --site-dir ../site
      - name: Commit site/ si cambió
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          if git diff --cached --quiet; then
            echo "Sin cambios en site/ — nada que commitear."
          else
            git commit -m "chore(wiki): rebuild site" -m "Generado automáticamente por wiki-build.yml desde wiki-src/**."
            git push
          fi
