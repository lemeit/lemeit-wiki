site_name: Documentación de Proyectos Lemeit
site_description: Documentación técnica y bitácora de los proyectos de lemeit.ar — Red de Monitoreo Ambiental, Eureka AI y los que se sumen
site_author: Ing. Luciano Lamaita
site_url: https://wiki.lemeit.ar/

repo_name: lemeit/lemeit-wiki
repo_url: https://github.com/lemeit/lemeit-wiki
edit_uri: ''

docs_dir: docs  # los .md editables viven directamente acá

theme:
  name: material
  language: es
  # Los colores reales de las dos paletas (fondo, texto, acento naranja)
  # se pisan en stylesheets/lemeit-retro.css con los mismos hex que usan
  # los tres dashboards — primary/accent acá abajo son solo el punto de
  # partida antes de que cargue esa hoja de estilos.
  palette:
    - scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Modo oscuro
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Modo claro
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # navigation.instant sacado: no es compatible con el selector de
    # idioma contextual del plugin de i18n (mkdocs-static-i18n) - ver
    # advertencia en el build. navigation.tracking dependia de instant,
    # se saca junto.
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.footer
    - navigation.path
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

extra_css:
  - stylesheets/lemeit-retro.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: Lemeit Projects Documentation
          nav_translations:
            Inicio: Home
            Red de Monitoreo Ambiental: Environmental Monitoring Network
            Resumen: Overview
            Monitoreo Ambiental Escolar (aq.lemeit.ar): School Air Quality Monitoring (aq.lemeit.ar)
            EMAS (emas.lemeit.ar): EMAS (emas.lemeit.ar)
            Calidad del Agua (wq.lemeit.ar): Water Quality (wq.lemeit.ar)
            Fuentes y licencias: Sources and licenses
            Bitácora: Log (Spanish only)
            Eureka AI: Eureka AI
            Profe Lamaita: Profe Lamaita

nav:
  - Inicio: index.md
  - Red de Monitoreo Ambiental:
      - Resumen: red-ambiental/index.md
      - Monitoreo Ambiental Escolar (aq.lemeit.ar): red-ambiental/01-aire-saladillo.md
      - EMAS (emas.lemeit.ar): red-ambiental/02-ema-saladillo.md
      - Calidad del Agua (wq.lemeit.ar): red-ambiental/03-agua-saladillo.md
      - Fuentes y licencias: red-ambiental/04-fuentes-licencias.md
      - Bitácora: red-ambiental/99-bitacora.md
  - Eureka AI:
      - Resumen: eureka-tutor/index.md
  - Profe Lamaita:
      - Resumen: profe-lemeit/index.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: '¶'
      toc_depth: 2
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

