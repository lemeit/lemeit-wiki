name: Build wiki (MkDocs Material)
on:
  push:
    branches: [main]
    paths:
      - 'wiki-src/**'
      - '.github/workflows/wiki-build.yml'
  pull_request:
    paths:
      - 'wiki-src/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: wiki-src/requirements.txt
      - name: Install MkDocs + Material
        run: pip install -r wiki-src/requirements.txt
      - name: Validar build (sin commitear nada)
        run: |
          cd wiki-src
          mkdocs build --site-dir /tmp/site-check --strict
